name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      # EMCP_OFFLINE makes a model cache miss an error rather than a live call,
      # so CI can never spend anything or depend on a key.
      - run: npm test
        env:
          EMCP_OFFLINE: "1"
      # The end-to-end test fetches a third MCP server, one this repo was not
      # built against, so it needs the network. Every server-specific
      # assumption here so far was found by a server that broke it.
      - run: npm test
        env:
          EMCP_OFFLINE: "1"
          EMCP_E2E: "1"
