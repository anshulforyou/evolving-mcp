name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      # EMCP_OFFLINE makes a model cache miss an error rather than a live call,
      # so CI can never spend anything or depend on a key.
      - run: npm test
        env:
          EMCP_OFFLINE: "1"
